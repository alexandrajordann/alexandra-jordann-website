<!doctype html>
<html><head><meta charset="utf-8"/>
<title>Content Manager — Alexandra Jordann</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500&display=swap" rel="stylesheet">
<style>body{font-family:Manrope,sans-serif}</style>
<!-- Netlify Identity lets the CMS know who you are -->
<script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<!-- Decap CMS (the free, open-source successor to Netlify CMS) -->
<script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
<script>
if (window.netlifyIdentity) {
  window.netlifyIdentity.on("init", user => { if (!user) window.netlifyIdentity.on("login", () => document.location.reload()); });
}
</script>
</body></html>
